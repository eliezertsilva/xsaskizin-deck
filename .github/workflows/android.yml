name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: |
          npm install
          npx expo install --fix || true

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk xsaskizin-deck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xsaskizin-deck-apk
          path: xsaskizin-deck.apk

      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: xSaskizin Deck (build ${{ github.run_number }})
          body: APK gerado automaticamente. Baixe o arquivo xsaskizin-deck.apk no celular e instale.
          files: xsaskizin-deck.apk
